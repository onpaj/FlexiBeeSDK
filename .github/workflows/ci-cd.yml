name: Build and Publish NuGet Package

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # required for nuget.org trusted publishing (OIDC)

    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: '8.0.x' # Replace this with your .NET version

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v0.9.7
        with:
          versionSpec: '5.x'

      - name: Use GitVersion
        id: gitversion
        uses: gittools/actions/gitversion/execute@v0.9.7
          
      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build /p:Version=${{ env.GitVersion_MajorMinorPatch }} --configuration Release --no-restore

      - name: Pack
        run: dotnet pack /p:PackageVersion=${{ env.GitVersion_SemVer }} --no-build --configuration Release --output out

      # Exchange the GitHub OIDC token for a short-lived nuget.org API key.
      # The key is valid for 1 hour, so request it immediately before pushing.
      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: Remiiik # nuget.org account that owns the trusted publishing policy

      - name: Publish nupkg
        run: dotnet nuget push "**/*.nupkg" --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json

      - name: Publish snupkg
        run: dotnet nuget push "**/*.snupkg" --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://www.nuget.org/api/v2/symbolpackage
